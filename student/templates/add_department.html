{% extends 'base.html' %}
{% block title %}Add Department{% endblock %}
{% block content %}
<style>
  .form-wrapper { display:flex; justify-content:center; align-items:center; padding:40px 15px; }
  .form-card { background:white; width:100%; max-width:500px; border-radius:20px; padding:35px; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
  .form-card h3 { font-weight:800; text-align:center; margin-bottom:8px; color:#0d6efd; }
  .form-card p { text-align:center; color:#64748b; font-size:13px; margin-bottom:25px; }
  .form-group { margin-bottom:20px; }
  .form-group label { font-weight:600; margin-bottom:6px; display:block; font-size:14px; color:#334155; }
  .form-group input, .form-group textarea { width:100%; padding:12px 14px; border:1.5px solid #dee2e6; border-radius:12px; outline:none; font-size:14px; transition:0.2s; }
  .form-group input:focus, .form-group textarea:focus { border-color:#0d6efd; box-shadow:0 0 0 3px rgba(13,110,253,0.15); }
  .btn-submit { width:100%; background:linear-gradient(90deg,#0d6efd,#0a58ca); color:white; border:none; padding:12px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; margin-top:5px; }
  .btn-submit:hover { opacity:0.9; }
</style>

<div class="form-wrapper">
  <div class="form-card">
    <h3>+ Add Department</h3>
    <p>Create new department for your college</p>
    
    <form method="POST">
      {% csrf_token %}
      
      <div class="form-group">
        <label>Department Name</label>
        <input type="text" name="dept_name" placeholder="Ex: Computer Science & Engineering" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="4" placeholder="Ex: python development department, cse department..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Add Department</button>
    </form>
    
    <div style="text-align:center; margin-top:20px; display:flex; gap:10px; justify-content:center;">
      <a href="{% url 'view_department' %}" style="background:#e2e8f0; color:#334155; padding:8px 18px; border-radius:20px; text-decoration:none; font-weight:600; font-size:13px;">View List</a>
      <a href="{% url 'dashboard' %}" style="color:#0d6efd; text-decoration:none; font-weight:600; font-size:13px; padding:8px 10px;">← Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
