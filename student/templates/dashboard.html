{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<style>
  .dash-header{ background:white; border-radius:15px; padding:20px 25px; box-shadow:0 4px 15px rgba(0,0,0,0.05); margin-bottom:25px; }
  .dash-header h2{ font-weight:800; margin:0; font-size:22px; }
  .dash-header p{ margin:5px 0 0 0; color:#64748b; font-size:13px; }
  .card-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:20px; }
  .stat-card{ background:white; border-radius:18px; padding:25px; box-shadow:0 6px 20px rgba(0,0,0,0.06); text-align:center; transition:0.3s; border-top:4px solid #0d6efd; }
  .stat-card:hover{ transform:translateY(-5px); box-shadow:0 12px 25px rgba(0,0,0,0.1); }
  .stat-card h4{ font-weight:700; font-size:16px; margin-bottom:15px; color:#1e293b; }
  .btn-view{ padding:6px 18px; border-radius:20px; text-decoration:none; color:white; font-size:13px; font-weight:600; display:inline-block; }
  .btn-blue{ background:#0d6efd; } .btn-green{ background:#198754; } .btn-yellow{ background:#f59e0b; }
  .logout-area{ margin-top:25px; }
  .btn-logout{ background:#dc3545; color:white; padding:8px 20px; border-radius:20px; text-decoration:none; font-size:13px; font-weight:600; }
</style>

<div style="padding:15px;">
  <div class="dash-header">
    <h2>Student Management</h2>
    <p>Welcome, {{ request.user.username|default:"irfan" }} 👋 You have successfully logged in!</p>
  </div>

  <div class="card-grid">
    <div class="stat-card" style="border-top-color:#0d6efd;">
      <h4>My Profile</h4>
      <a href="{% url 'my_profile' %}" class="btn-view btn-blue">View</a>
    </div>

    <div class="stat-card" style="border-top-color:#198754;">
      <h4>Departments</h4>
      <a href="{% url 'view_department' %}" class="btn-view btn-green">View</a>
    </div>

    <div class="stat-card" style="border-top-color:#f59e0b;">
      <h4>Students</h4>
      <a href="{% url 'view_student' %}" class="btn-view btn-yellow">View</a>
    </div>
  </div>

  <div class="logout-area">
    <a href="{% url 'logout' %}" class="btn-logout">Logout</a>
  </div>
</div>
{% endblock %}
