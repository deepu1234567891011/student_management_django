{% extends 'base.html' %}
{% block title %}Add Student{% endblock %}
{% block content %}
<style>
  .form-wrapper { display:flex; justify-content:center; align-items:center; padding:30px 15px; }
  .form-card { background:white; width:100%; max-width:550px; border-radius:20px; padding:35px; box-shadow:0 10px 30px rgba(0,0,0,0.1); }
  .form-card h3 { font-weight:800; text-align:center; margin-bottom:25px; color:#0d6efd; }
  .form-group { margin-bottom:18px; }
  .form-group label { font-weight:600; margin-bottom:6px; display:block; font-size:14px; }
  .form-group input, .form-group select { width:100%; padding:11px 14px; border:1.5px solid #dee2e6; border-radius:12px; outline:none; font-size:14px; transition:0.2s; }
  .form-group input:focus, .form-group select:focus { border-color:#0d6efd; box-shadow:0 0 0 3px rgba(13,110,253,0.15); }
  .btn-submit { width:100%; background:linear-gradient(90deg,#0d6efd,#0a58ca); color:white; border:none; padding:12px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; margin-top:10px; }
  .btn-submit:hover { opacity:0.9; }
</style>

<div class="form-wrapper">
  <div class="form-card">
    <h3>+ Add New Student</h3>
    <form method="POST">
      {% csrf_token %}
      
      <div class="form-group">
        <label>UserName</label>
        <input type="text" name="username" placeholder="Enter UserName" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter Email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter Password" required>
      </div>

      <div class="form-group">
        <label>Student Name</label>
        <input type="text" name="name" placeholder="Enter Student Full Name" required>
      </div>

      <div class="form-group">
        <label>Course</label>
        <input type="text" name="course" placeholder="Ex: B.Tech, M.Tech" required>
      </div>

      <div class="form-group">
        <label>Department</label>
        <select name="department" required>
          <option value="">-- Select Department --</option>
          {% for dept in departments %}
          <option value="{{ dept.id }}">{{ dept.dept_name }}</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn-submit">Add Student</button>
    </form>
    
    <div style="text-align:center; margin-top:18px;">
      <a href="{% url 'dashboard' %}" style="color:#0d6efd; text-decoration:none; font-weight:600;">← Back to Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
