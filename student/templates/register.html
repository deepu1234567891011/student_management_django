<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - SMS</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
  body{
    min-height:100vh;
    display:flex; justify-content:center; align-items:center;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1400&q=80');
    background-size:cover; background-position:center;
    padding:15px;
  }
  .reg-card{
    background:rgba(255,255,255,0.96);
    width:100%; max-width:460px;
    border-radius:22px; padding:32px 28px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    animation: pop 0.6s ease;
  }
  @keyframes pop{ from{ transform:scale(0.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .logo{ text-align:center; font-size:50px; }
  .title{ text-align:center; font-weight:800; font-size:22px; color:#0f172a; }
  .subtitle{ text-align:center; color:#64748b; font-size:13px; margin:6px 0 18px 0; }
  .form-group{ margin-bottom:14px; }
  .form-group label{ font-weight:600; font-size:13px; margin-bottom:5px; display:block; color:#334155; }
  .form-group input{ width:100%; padding:11px 14px; border:1.5px solid #e2e8f0; border-radius:12px; outline:none; font-size:14px; }
  .form-group input:focus{ border-color:#0d6efd; box-shadow:0 0 0 3px rgba(13,110,253,0.15); }
  .btn-reg{ width:100%; background:linear-gradient(90deg,#0d6efd,#4f46e5); color:white; border:none; padding:12px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; margin-top:10px; }
  .btn-reg:hover{ opacity:0.9; }
  .link{ text-align:center; margin-top:16px; font-size:13px; }
  .link a{ color:#0d6efd; text-decoration:none; font-weight:700; }
</style>
</head>
<body>

<div class="reg-card">
  <div class="logo">📝🎓✨</div>
  <div class="title">Student Registration 🚀</div>
  <div class="subtitle">Create your account now 💙👇</div>

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label>👤 UserName</label>
      <input type="text" name="username" placeholder="Enter UserName 😎" required>
    </div>
    <div class="form-group">
      <label>📧 Email</label>
      <input type="email" name="email" placeholder="Enter Email 💌" required>
    </div>
    <div class="form-group">
      <label>🔑 Password</label>
      <input type="password" name="password" placeholder="Enter Password 🔒" required>
    </div>
    <div class="form-group">
      <label>🔐 Confirm Password</label>
      <input type="password" name="confirm_password" placeholder="Confirm Password ✅" required>
    </div>
    <button type="submit" class="btn-reg">Register 🎉</button>
  </form>

  <div class="link">Already have account? <a href="/login/">Login Here 🔐</a></div>
  <div style="text-align:center; margin-top:10px; font-size:11px; color:#94a3b8;">Made with 💖 by Deepu</div>
</div>

</body>
</html>
