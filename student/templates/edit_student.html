<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Management system</h1>
    <h2>Edit student</h2>
    <form method="POST">
        {% csrf_token%}
        <label>Student Name</label>
        <input type="text" name="name" value="{{studnet.name}}"required><br><br>
        <label>Course</label>
        <input type="text" name="course" value="{{student.course}}"required><br><br>
        <label>Department:</label>
        <select name="department" required>
            {% for dept in departments %}
            <option value="{{dept.id}}"
            {% if dept.id == student.department.id%}selected{% endif %}>
            {{dept.dept_name}}
            </option>
            {% endfor %}
        </select>
        <br><br>
        <button type="submit">Update Student</button>
    </form>
    <br>
    <a href="{% url 'view_student'%}">Back to students</a>
</body>
</html>
