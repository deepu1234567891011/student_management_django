<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Edit Department</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Department Name:</label>
        <input type="text" name="department_name" values="{{department.dept_name}}" required>
        <br><br>
        <label>Description:</label>
        <textarea name="description" required>{{department.description}}</textarea>
        <br><br>
        <button type="submit">Update Department</button>
    </form>
</body>
</html>
